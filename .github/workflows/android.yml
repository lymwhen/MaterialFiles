name: Android CI

on: [push]

jobs:
  build:
    if: github.ref_type == 'branch'

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Build with Gradle
      run: ./gradlew assembleDebug lintVitalRelease
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 10

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Prepare release signing
      shell: bash
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        umask 077
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        test -s "$RUNNER_TEMP/release.jks"
    - name: Build signed release
      env:
        STORE_FILE: ${{ runner.temp }}/release.jks
        STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: ./gradlew assembleRelease
    - name: Publish GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
        if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
          git log -1 --format=%B "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
        fi
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --clobber
        else
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
        fi
    - name: Remove signing key
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release-notes.md"
